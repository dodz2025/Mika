name: Build Mika APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-33" "build-tools;34.0.0"

      - name: Build APK
        run: |
          set -e
          # finds the project folder (where AndroidManifest.xml is), inside "mika/" or at the repo root
          MANIFEST=$(find . -name AndroidManifest.xml -not -path "*/build/*" | head -1)
          cd "$(dirname "$MANIFEST")"
          BT="$ANDROID_HOME/build-tools/34.0.0"
          AJ="$ANDROID_HOME/platforms/android-33/android.jar"
          KS=debug.keystore
          rm -rf build && mkdir -p build/gen build/classes
          "$BT/aapt" package -f -m -J build/gen -M AndroidManifest.xml -S res -A assets -I "$AJ" -F build/res.apk
          javac --release 8 -Xlint:-options -cp "$AJ" -d build/classes $(find src build/gen -name '*.java')
          "$BT/d8" --release --min-api 23 --lib "$AJ" --output build $(find build/classes -name '*.class')
          cp build/res.apk build/raw.apk
          (cd build && "$BT/aapt" add raw.apk classes.dex > /dev/null)
          "$BT/zipalign" -f -p 4 build/raw.apk build/aligned.apk
          "$BT/apksigner" sign --ks "$KS" --ks-pass pass:android --key-pass pass:android \
            --ks-key-alias androiddebugkey --out build/Mika-Launcher.apk build/aligned.apk
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp build/Mika-Launcher.apk "$GITHUB_WORKSPACE/out/Mika-Launcher.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mika-Launcher
          path: out/Mika-Launcher.apk
