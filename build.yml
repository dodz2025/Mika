name: Build Mika APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          set -e
          ZIP="$(ls *.zip | head -1)"
          echo "Using $ZIP"
          unzip -q -o "$ZIP" -d _unz
          cd "$(dirname "$(find _unz -name AndroidManifest.xml | head -1)")"

          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT="$SDK/build-tools/34.0.0"
          AJ="$SDK/platforms/android-33/android.jar"
          if [ ! -x "$BT/aapt" ] || [ ! -f "$AJ" ]; then
            sudo chown -R "$USER" "$SDK" || true
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-33" "build-tools;34.0.0"
          fi

          rm -rf build && mkdir -p build/gen build/classes
          "$BT/aapt" package -f -m -J build/gen -M AndroidManifest.xml -S res -I "$AJ" -F build/res.apk
          javac --release 8 -Xlint:-options -cp "$AJ" -d build/classes $(find src build/gen -name '*.java')
          "$BT/d8" --release --min-api 21 --lib "$AJ" --output build $(find build/classes -name '*.class')
          cp build/res.apk build/raw.apk
          (cd build && "$BT/aapt" add raw.apk classes.dex > /dev/null)
          "$BT/zipalign" -f -p 4 build/raw.apk build/aligned.apk

          KS=signing/debug.keystore
          if [ ! -f "$KS" ]; then
            mkdir -p signing
            keytool -genkeypair -keystore "$KS" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Mika Debug,O=Mika,C=US"
          fi
          "$BT/apksigner" sign --ks "$KS" --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --out build/Mika-Launcher.apk build/aligned.apk
          "$BT/apksigner" verify build/Mika-Launcher.apk
          cp build/Mika-Launcher.apk "$GITHUB_WORKSPACE/Mika-Launcher.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Mika-Launcher
          path: Mika-Launcher.apk

      - name: Publish release (direct APK download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" Mika-Launcher.apk \
            --title "Mika build ${{ github.run_number }}" \
            --notes "Debug-signed APK built from the uploaded source zip."
